<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mad Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1815;
    --surface2: #232018;
    --border: #2e2a22;
    --accent: #e8a330;
    --accent2: #c4773a;
    --text: #f0ead8;
    --text-muted: #8a8070;
    --green: #5a9e6f;
    --red: #c0503a;
    --tag-bg: #2a2218;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; }

  /* Layout */
  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 32px 20px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .main { padding: 40px 48px; overflow-y: auto; }

  /* Sidebar */
  .logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 900; color: var(--accent); margin-bottom: 28px; display: flex; align-items: center; gap: 10px; }
  .logo span { font-size: 28px; }
  .nav-btn { background: none; border: none; color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; padding: 10px 14px; border-radius: 10px; cursor: pointer; text-align: left; width: 100%; transition: all 0.2s; display: flex; align-items: center; gap: 10px; letter-spacing: 0.3px; }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: var(--accent); color: #0f0e0c; font-weight: 700; }
  .nav-btn .icon { font-size: 18px; min-width: 22px; }
  .sidebar-sep { height: 1px; background: var(--border); margin: 10px 0; }

  /* Header */
  .page-header { margin-bottom: 36px; }
  .page-title { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 900; color: var(--accent); }
  .page-sub { color: var(--text-muted); margin-top: 6px; font-size: 14px; }

  /* Cards grid */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.2s; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .card:hover::before { opacity: 1; }
  .card-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; margin-bottom: 10px; color: var(--text); }
  .card-desc { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; line-height: 1.5; min-height: 20px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--tag-bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--text-muted); }
  .tag.kat { border-color: var(--accent2); color: var(--accent); }
  .card-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .btn-sm { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
  .btn-sm:hover { background: var(--surface2); color: var(--text); }
  .btn-sm.danger:hover { border-color: var(--red); color: var(--red); }

  .match-badge { position: absolute; top: 14px; right: 14px; background: var(--accent); color: #0f0e0c; border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 700; }

  /* Form panel */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 36px; max-width: 700px; }
  .panel h2 { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: var(--accent); margin-bottom: 28px; }
  .form-group { margin-bottom: 22px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; }
  input[type="text"], textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; transition: border-color 0.2s; outline: none; }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; }

  /* Tag input */
  .tag-input-outer { display: flex; gap: 8px; align-items: flex-start; }
  .tag-input-wrap { display: flex; flex-wrap: wrap; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-height: 48px; cursor: text; transition: border-color 0.2s; flex: 1; }
  .tag-input-wrap:focus-within { border-color: var(--accent); }
  .tag-input-wrap input { background: none; border: none; outline: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; min-width: 100px; flex: 1; padding: 4px; }
  .tag-add-btn { background: var(--accent); border: none; color: #0f0e0c; border-radius: 10px; padding: 0 16px; height: 48px; font-size: 20px; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: background 0.2s; line-height: 1; }
  .tag-add-btn:hover { background: var(--accent2); }
  .tag-pill { background: var(--tag-bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px 4px 12px; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .tag-pill.kat { border-color: var(--accent2); }
  .tag-pill button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0; transition: color 0.2s; }
  .tag-pill button:hover { color: var(--red); }

  /* Buttons */
  .btn { background: var(--accent); color: #0f0e0c; border: none; border-radius: 10px; padding: 12px 28px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn.secondary { background: none; border: 1px solid var(--border); color: var(--text-muted); }
  .btn.secondary:hover { border-color: var(--text-muted); color: var(--text); transform: none; }
  .btn-row { display: flex; gap: 12px; margin-top: 28px; }

  /* Search section */
  .search-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; margin-bottom: 32px; }
  .search-bar h3 { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); margin-bottom: 18px; }
  .search-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .search-action { margin-top: 18px; display: flex; gap: 12px; align-items: center; }

  /* Empty state */
  .empty { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .empty .em-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.4; }
  .empty p { font-size: 16px; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 36px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--accent); margin-bottom: 6px; }
  .modal-body { margin-top: 20px; }
  .detail-section { margin-bottom: 20px; }
  .detail-section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 10px; }
  .detail-section p { color: var(--text); line-height: 1.6; }
  .ing-list { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Toast */
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--green); color: white; padding: 12px 22px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 200; animation: fadeIn 0.3s; }
  .toast.err { background: var(--red); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Responsive */
  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; flex-direction: row; flex-wrap: wrap; padding: 16px; }
    .logo { margin-bottom: 0; font-size: 18px; }
    .main { padding: 24px 16px; }
    .search-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span>🍽️</span> Mad Planner</div>
    <button class="nav-btn active" id="nav-soeg" onclick="showPage('soeg')"><span class="icon">🔍</span> Find en ret</button>
    <button class="nav-btn" id="nav-alle" onclick="showPage('alle')"><span class="icon">📋</span> Alle retter</button>
    <div class="sidebar-sep"></div>
    <button class="nav-btn" id="nav-ny" onclick="showPage('ny')"><span class="icon">✚</span> Ny ret</button>
  </aside>

  <main class="main" id="main-content"></main>
</div>

<!-- Detail Modal -->
<div id="modal" class="modal-backdrop" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modal-inner">
    <h2 id="modal-name"></h2>
    <div class="modal-body" id="modal-body"></div>
    <div class="btn-row" style="margin-top:24px">
      <button class="btn secondary" onclick="closeModal()">Luk</button>
      <button class="btn secondary" id="modal-edit-btn">Rediger</button>
      <button class="btn secondary danger" id="modal-del-btn" style="border-color:#c0503a;color:#c0503a">Slet</button>
    </div>
  </div>
</div>

<script>
// ── State ───────────────────────────────────────────────────────────
let retter = [];
let currentPage = 'soeg';
let editingId = null;
let currentModalId = null;

// ── Helpers ──────────────────────────────────────────────────────────
function haToken() {
  // Try to get HA long-lived access token from URL param, localStorage, or parent frame
  const params = new URLSearchParams(window.location.search);
  if (params.get('token')) return params.get('token');
  if (localStorage.getItem('ha_token')) return localStorage.getItem('ha_token');
  return '';
}

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  const token = haToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch('/api/mad_planner' + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function toast(msg, err=false) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ── Tag Input Component ───────────────────────────────────────────────
function createTagInput(id, placeholder, kategori=false) {
  let tags = [];

  const outer = document.createElement('div');
  outer.className = 'tag-input-outer';

  const wrap = document.createElement('div');
  wrap.className = 'tag-input-wrap';

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = placeholder;
  inp.inputMode = 'text';
  inp.setAttribute('enterkeyhint', 'done');

  function addCurrent() {
    const val = inp.value.trim().replace(/,$/, '');
    if (val && !tags.includes(val)) { tags.push(val); renderTags(); }
    inp.value = '';
    inp.focus();
  }

  function renderTags() {
    wrap.querySelectorAll('.tag-pill').forEach(e => e.remove());
    tags.forEach((tag, i) => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill' + (kategori ? ' kat' : '');
      pill.innerHTML = `${tag} <button type="button">×</button>`;
      pill.querySelector('button').onclick = () => { tags.splice(i, 1); renderTags(); };
      wrap.insertBefore(pill, inp);
    });
  }

  inp.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ',') && inp.value.trim()) {
      e.preventDefault();
      addCurrent();
    } else if (e.key === 'Backspace' && !inp.value && tags.length) {
      tags.pop(); renderTags();
    }
  });

  // Also catch mobile "Go"/"Done" via input event after enter on virtual keyboard
  inp.addEventListener('keyup', e => {
    if (e.key === 'Enter' && inp.value.trim()) { addCurrent(); }
  });

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'tag-add-btn';
  addBtn.textContent = '+';
  addBtn.title = 'Tilføj';
  addBtn.onclick = () => { if (inp.value.trim()) addCurrent(); };

  wrap.appendChild(inp);
  outer.appendChild(wrap);
  outer.appendChild(addBtn);

  // Expose API on the outer element
  outer._getTags = () => tags;
  outer._setTags = (newTags) => { tags = [...newTags]; renderTags(); };
  return outer;
}

// ── Pages ─────────────────────────────────────────────────────────────
function showPage(page) {
  currentPage = page;
  editingId = null;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('nav-' + page);
  if (btn) btn.classList.add('active');
  render();
}

async function loadRetter() {
  try { retter = await api('GET', '/retter'); }
  catch(e) { retter = []; }
}

function renderCards(list, showMatch=false) {
  if (!list.length) {
    return `<div class="empty"><div class="em-icon">🥄</div><p>Ingen retter fundet</p></div>`;
  }
  return `<div class="cards-grid">${list.map(ret => `
    <div class="card" onclick="openModal('${ret.id}')">
      ${showMatch && ret.matches > 0 ? `<div class="match-badge">${ret.matches} match</div>` : ''}
      <div class="card-name">${esc(ret.navn)}</div>
      <div class="card-desc">${esc(ret.beskrivelse || '')}</div>
      <div class="tags">
        ${(ret.kategorier||[]).map(k => `<span class="tag kat">${esc(k)}</span>`).join('')}
        ${(ret.ingredienser||[]).slice(0,5).map(i => `<span class="tag">${esc(i)}</span>`).join('')}
        ${(ret.ingredienser||[]).length > 5 ? `<span class="tag">+${ret.ingredienser.length-5} mere</span>` : ''}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="btn-sm" onclick="editRet('${ret.id}')">✏️ Rediger</button>
        <button class="btn-sm danger" onclick="deleteRet('${ret.id}')">🗑 Slet</button>
      </div>
    </div>
  `).join('')}</div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function render() {
  const el = document.getElementById('main-content');

  if (currentPage === 'soeg') {
    el.innerHTML = `
      <div class="page-header">
        <div class="page-title">Find en ret</div>
        <div class="page-sub">Søg på ingredienser og kategorier — retter med flest matches vises øverst</div>
      </div>
      <div class="search-bar">
        <h3>🔍 Søgefiltre</h3>
        <div class="search-row">
          <div class="form-group" style="margin:0">
            <label>Ingredienser</label>
            <div id="soeg-ing-wrap"></div>
          </div>
          <div class="form-group" style="margin:0">
            <label>Kategorier</label>
            <div id="soeg-kat-wrap"></div>
          </div>
        </div>
        <div class="search-action">
          <button class="btn" onclick="doSearch()">Søg</button>
          <button class="btn secondary" onclick="clearSearch()">Ryd</button>
        </div>
      </div>
      <div id="soeg-results"></div>
    `;
    const ingWrap = createTagInput('soeg-ing', 'Tilsæt ingrediens…');
    const katWrap = createTagInput('soeg-kat', 'Tilsæt kategori…', true);
    document.getElementById('soeg-ing-wrap').replaceWith(ingWrap);
    ingWrap.id = 'soeg-ing-wrap';
    document.getElementById('soeg-kat-wrap').replaceWith(katWrap);
    katWrap.id = 'soeg-kat-wrap';
    // Show all on load
    document.getElementById('soeg-results').innerHTML = renderCards(retter);

  } else if (currentPage === 'alle') {
    el.innerHTML = `
      <div class="page-header">
        <div class="page-title">Alle retter</div>
        <div class="page-sub">${retter.length} retter i din samling</div>
      </div>
      ${renderCards(retter)}
    `;

  } else if (currentPage === 'ny' || editingId) {
    const ret = editingId ? retter.find(r => r.id === editingId) : null;
    el.innerHTML = `
      <div class="page-header">
        <div class="page-title">${ret ? 'Rediger ret' : 'Ny ret'}</div>
        <div class="page-sub">${ret ? `Opdater oplysninger om ${esc(ret.navn)}` : 'Tilføj en ny ret til din samling'}</div>
      </div>
      <div class="panel">
        <div class="form-group">
          <label>Navn på retten *</label>
          <input type="text" id="f-navn" placeholder="f.eks. Spaghetti Bolognese" value="${esc(ret?.navn||'')}"/>
        </div>
        <div class="form-group">
          <label>Beskrivelse</label>
          <textarea id="f-desc" placeholder="Kort beskrivelse af retten…">${esc(ret?.beskrivelse||'')}</textarea>
        </div>
        <div class="form-group">
          <label>Ingredienser <span style="color:var(--text-muted);font-size:11px;text-transform:none">(tryk Enter efter hver)</span></label>
          <div id="f-ing-wrap"></div>
        </div>
        <div class="form-group">
          <label>Kategorier <span style="color:var(--text-muted);font-size:11px;text-transform:none">(f.eks. Gryderetter, Grill)</span></label>
          <div id="f-kat-wrap"></div>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="saveRet()">${ret ? 'Gem ændringer' : 'Opret ret'}</button>
          <button class="btn secondary" onclick="showPage('alle')">Annuller</button>
        </div>
      </div>
    `;
    const ingWrap = createTagInput('f-ing', 'Tilsæt ingrediens…');
    const katWrap = createTagInput('f-kat', 'Tilsæt kategori…', true);
    document.getElementById('f-ing-wrap').replaceWith(ingWrap);
    ingWrap.id = 'f-ing-wrap';
    document.getElementById('f-kat-wrap').replaceWith(katWrap);
    katWrap.id = 'f-kat-wrap';
    if (ret) {
      ingWrap._setTags(ret.ingredienser || []);
      katWrap._setTags(ret.kategorier || []);
    }
  }
}

async function doSearch() {
  const ingWrap = document.getElementById('soeg-ing-wrap');
  const katWrap = document.getElementById('soeg-kat-wrap');
  const ing = ingWrap._getTags ? ingWrap._getTags() : [];
  const kat = katWrap._getTags ? katWrap._getTags() : [];
  try {
    const res = await api('POST', '/soeg', { ingredienser: ing, kategorier: kat });
    document.getElementById('soeg-results').innerHTML = renderCards(res, ing.length > 0 || kat.length > 0);
  } catch(e) { toast('Søgning fejlede', true); }
}

function clearSearch() { render(); }

async function saveRet() {
  const navn = document.getElementById('f-navn').value.trim();
  if (!navn) { toast('Navn er påkrævet', true); return; }
  const ingWrap = document.getElementById('f-ing-wrap');
  const katWrap = document.getElementById('f-kat-wrap');
  const body = {
    navn,
    beskrivelse: document.getElementById('f-desc').value.trim(),
    ingredienser: ingWrap._getTags ? ingWrap._getTags() : [],
    kategorier: katWrap._getTags ? katWrap._getTags() : [],
  };
  try {
    if (editingId) {
      const updated = await api('PUT', '/retter/' + editingId, body);
      const idx = retter.findIndex(r => r.id === editingId);
      if (idx !== -1) retter[idx] = updated;
      toast('Ret opdateret ✓');
    } else {
      const newRet = await api('POST', '/retter', body);
      retter.push(newRet);
      toast('Ret oprettet ✓');
    }
    showPage('alle');
  } catch(e) { toast('Kunne ikke gemme', true); }
}

function editRet(id) {
  editingId = id;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-ny').classList.add('active');
  render();
}

async function deleteRet(id) {
  if (!confirm('Slet denne ret?')) return;
  try {
    await api('DELETE', '/retter/' + id);
    retter = retter.filter(r => r.id !== id);
    toast('Ret slettet');
    closeModal();
    render();
  } catch(e) { toast('Kunne ikke slette', true); }
}

function openModal(id) {
  const ret = retter.find(r => r.id === id);
  if (!ret) return;
  currentModalId = id;
  document.getElementById('modal-name').textContent = ret.navn;
  document.getElementById('modal-body').innerHTML = `
    ${ret.beskrivelse ? `<div class="detail-section"><h4>Beskrivelse</h4><p>${esc(ret.beskrivelse)}</p></div>` : ''}
    ${ret.kategorier?.length ? `<div class="detail-section"><h4>Kategorier</h4><div class="ing-list">${ret.kategorier.map(k=>`<span class="tag kat">${esc(k)}</span>`).join('')}</div></div>` : ''}
    ${ret.ingredienser?.length ? `<div class="detail-section"><h4>Ingredienser (${ret.ingredienser.length})</h4><div class="ing-list">${ret.ingredienser.map(i=>`<span class="tag">${esc(i)}</span>`).join('')}</div></div>` : '<div class="detail-section"><p style="color:var(--text-muted)">Ingen ingredienser tilføjet</p></div>'}
  `;
  document.getElementById('modal-edit-btn').onclick = () => { closeModal(); editRet(id); };
  document.getElementById('modal-del-btn').onclick = () => deleteRet(id);
  document.getElementById('modal').style.display = 'flex';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').style.display = 'none';
  currentModalId = null;
}

// ── Init ─────────────────────────────────────────────────────────────
(async () => {
  await loadRetter();
  render();
})();
</script>
</body>
</html>
