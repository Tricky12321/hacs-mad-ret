<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mad Planner</title>
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1815;
    --surface2: #232018;
    --border: #2e2a22;
    --accent: #e8a330;
    --accent2: #c4773a;
    --text: #f0ead8;
    --text-muted: #8a8070;
    --green: #5a9e6f;
    --red: #c0503a;
    --tag-bg: #2a2218;
    --person-color: #4a9fd4;
    --person-border: #2a6f9a;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }

  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 28px 16px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .main { padding: 36px 44px; overflow-y: auto; }

  .logo { font-family: var(--serif); font-size: 20px; font-weight: 900; color: var(--accent); margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
  .logo span { font-size: 26px; }
  .nav-btn { background: none; border: none; color: var(--text-muted); font-family: var(--sans); font-size: 14px; font-weight: 500; padding: 10px 14px; border-radius: 10px; cursor: pointer; text-align: left; width: 100%; transition: all 0.15s; display: flex; align-items: center; gap: 10px; }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: var(--accent); color: #0f0e0c; font-weight: 700; }
  .nav-btn .icon { font-size: 17px; min-width: 20px; }
  .sidebar-sep { height: 1px; background: var(--border); margin: 8px 0; }

  .page-header { margin-bottom: 32px; }
  .page-title { font-family: var(--serif); font-size: 32px; font-weight: 900; color: var(--accent); }
  .page-sub { color: var(--text-muted); margin-top: 5px; font-size: 14px; }

  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.2s; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.4); }
  .card:hover::before { opacity: 1; }
  .card-name { font-family: var(--serif); font-size: 19px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .card-desc { color: var(--text-muted); font-size: 13px; margin-bottom: 12px; line-height: 1.5; min-height: 18px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { background: var(--tag-bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font-size: 12px; color: var(--text-muted); }
  .tag.kat { border-color: var(--accent2); color: var(--accent); }
  .tag.person { border-color: var(--person-border); color: var(--person-color); background: #111e28; }
  .card-actions { display: flex; gap: 7px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .btn-sm { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-family: var(--sans); transition: all 0.15s; }
  .btn-sm:hover { background: var(--surface2); color: var(--text); }
  .btn-sm.danger:hover { border-color: var(--red); color: var(--red); }
  .match-badge { position: absolute; top: 13px; right: 13px; background: var(--accent); color: #0f0e0c; border-radius: 20px; padding: 2px 9px; font-size: 11px; font-weight: 700; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 32px; max-width: 680px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.8px; }
  input[type="text"], textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 11px 15px; color: var(--text); font-family: var(--sans); font-size: 15px; transition: border-color 0.15s; outline: none; }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 76px; }

  .tag-field-wrap { flex: 1; position: relative; }
  .tag-input-wrap { display: flex; flex-wrap: wrap; gap: 5px; background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 7px 9px; min-height: 46px; cursor: text; transition: border-color 0.15s; }
  .tag-input-wrap:focus-within { border-color: var(--accent); }
  .tag-input-wrap input { background: none; border: none; outline: none; color: var(--text); font-family: var(--sans); font-size: 14px; min-width: 100px; flex: 1; padding: 3px; }
  .tag-outer { display: flex; gap: 8px; align-items: flex-start; }
  .tag-add-btn { background: var(--accent); border: none; color: #0f0e0c; border-radius: 9px; padding: 0 15px; height: 46px; font-size: 20px; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: background 0.15s; line-height: 1; }
  .tag-add-btn:hover { background: var(--accent2); }
  .tag-pill { background: var(--tag-bg); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px 3px 10px; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 5px; }
  .tag-pill.kat { border-color: var(--accent2); }
  .tag-pill button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; transition: color 0.15s; }
  .tag-pill button:hover { color: var(--red); }

  .tag-suggestions { position: absolute; top: calc(100% + 3px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-height: 200px; overflow-y: auto; }
  .tag-sug-item { padding: 9px 15px; cursor: pointer; font-size: 14px; transition: background 0.12s; display: flex; align-items: center; justify-content: space-between; }
  .tag-sug-item:hover, .tag-sug-item.focused { background: var(--surface2); }
  .tag-sug-item .sug-count { font-size: 11px; color: var(--text-muted); }
  .tag-sug-new { color: var(--accent); }

  .person-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .person-chip { background: var(--surface2); border: 2px solid var(--border); border-radius: 9px; padding: 7px 14px; cursor: pointer; font-size: 14px; color: var(--text-muted); transition: all 0.15s; display: flex; align-items: center; gap: 7px; user-select: none; }
  .person-chip:hover { border-color: var(--person-border); color: var(--person-color); }
  .person-chip.selected { background: #111e28; border-color: var(--person-border); color: var(--person-color); font-weight: 600; }
  .person-chip .check { opacity: 0; transition: opacity 0.12s; font-size: 13px; }
  .person-chip.selected .check { opacity: 1; }
  .person-chip-empty { color: var(--text-muted); font-size: 13px; font-style: italic; }

  .person-search-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .person-search-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--text-muted); transition: all 0.15s; user-select: none; }
  .person-search-chip:hover { border-color: var(--person-border); color: var(--person-color); }
  .person-search-chip.selected { background: #111e28; border-color: var(--person-border); color: var(--person-color); font-weight: 600; }

  .person-list { display: flex; flex-direction: column; gap: 9px; }
  .person-row { background: var(--surface2); border: 1px solid var(--border); border-radius: 11px; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; }
  .person-row-left { display: flex; align-items: center; gap: 11px; }
  .person-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--person-border); color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .person-name { font-size: 15px; font-weight: 500; }
  .person-meta { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

  .btn { background: var(--accent); color: #0f0e0c; border: none; border-radius: 9px; padding: 11px 26px; font-family: var(--sans); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn.secondary { background: none; border: 1px solid var(--border); color: var(--text-muted); }
  .btn.secondary:hover { border-color: var(--text-muted); color: var(--text); transform: none; }
  .btn-row { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }

  .search-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 28px; }
  .search-bar h3 { font-family: var(--serif); font-size: 17px; color: var(--accent); margin-bottom: 16px; }
  .search-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .search-action { margin-top: 16px; display: flex; gap: 10px; align-items: center; }

  .inline-add { display: flex; gap: 8px; margin-top: 10px; }
  .inline-add input { flex: 1; }

  .empty { text-align: center; padding: 70px 20px; color: var(--text-muted); }
  .empty .em-icon { font-size: 52px; margin-bottom: 14px; opacity: 0.35; }
  .empty p { font-size: 15px; }

  /* Loading overlay */
  .loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 999; }
  .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .loading p { color: var(--text-muted); font-size: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 32px; max-width: 540px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-family: var(--serif); font-size: 23px; color: var(--accent); margin-bottom: 5px; }
  .modal-body { margin-top: 18px; }
  .detail-section { margin-bottom: 18px; }
  .detail-section h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 9px; }
  .detail-section p { color: var(--text); line-height: 1.6; }
  .ing-list { display: flex; flex-wrap: wrap; gap: 5px; }

  .toast { position: fixed; bottom: 26px; right: 26px; background: var(--green); color: white; padding: 11px 20px; border-radius: 9px; font-size: 14px; font-weight: 500; z-index: 200; animation: fadeIn 0.25s; }
  .toast.err { background: var(--red); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; flex-direction: row; flex-wrap: wrap; padding: 14px; gap: 4px; }
    .logo { margin-bottom: 0; font-size: 17px; width: 100%; }
    .main { padding: 20px 14px; }
    .search-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Loading overlay — vises mens token hentes -->
<div class="loading" id="loading-overlay">
  <div class="loading-spinner"></div>
  <p>Forbinder til Home Assistant…</p>
</div>

<div class="app" style="display:none" id="app">
  <aside class="sidebar">
    <div class="logo"><span>🍽️</span> Mad Planner</div>
    <button class="nav-btn active" id="nav-soeg" onclick="showPage('soeg')"><span class="icon">🔍</span> Find en ret</button>
    <button class="nav-btn" id="nav-alle" onclick="showPage('alle')"><span class="icon">📋</span> Alle retter</button>
    <div class="sidebar-sep"></div>
    <button class="nav-btn" id="nav-ny" onclick="showPage('ny')"><span class="icon">✚</span> Ny ret</button>
    <div class="sidebar-sep"></div>
    <button class="nav-btn" id="nav-personer" onclick="showPage('personer')"><span class="icon">👤</span> Personer</button>
  </aside>
  <main class="main" id="main-content"></main>
</div>

<div id="modal" class="modal-backdrop" style="display:none" onclick="closeModal(event)">
  <div class="modal">
    <h2 id="modal-name"></h2>
    <div class="modal-body" id="modal-body"></div>
    <div class="btn-row" style="margin-top:22px">
      <button class="btn secondary" onclick="closeModal()">Luk</button>
      <button class="btn secondary" id="modal-edit-btn">Rediger</button>
      <button class="btn secondary" id="modal-del-btn" style="border-color:#c0503a;color:#c0503a">Slet</button>
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────
let retter = [];
let personer = [];
let currentPage = 'soeg';
let editingId = null;
let soegPersonIds = [];
let _token = null;
let _pendingTokenResolve = null;

// ── Auth ──────────────────────────────────────────────────────────────
// HA kalder externalAuthCallback direkte på window — den skal resolve
// den ventende Promise fra getToken(), ikke blot sætte _token.
window.externalAuthCallback = (tokenData) => {
  const token = tokenData?.access_token || tokenData?.token || '';
  _token = token;
  if (_pendingTokenResolve) {
    const r = _pendingTokenResolve;
    _pendingTokenResolve = null;
    r(token);
  }
};

function getToken() {
  if (_token) return Promise.resolve(_token);

  // Same-origin: prøv direkte adgang til HA's auth objekt i parent vinduet
  try {
    if (window.parent !== window) {
      const ha = window.parent.document.querySelector('home-assistant');
      const t = ha?.__hass?.auth?.data?.access_token || ha?._hass?.auth?.data?.access_token;
      if (t) { _token = t; return Promise.resolve(t); }
    }
  } catch(e) {}

  return new Promise(resolve => {
    _pendingTokenResolve = resolve;

    // Lyt også efter postMessage-svar (HA sender tilbage i nogle versioner)
    const handler = e => {
      const token =
        e.data?.result?.access_token ||
        e.data?.payload?.access_token ||
        e.data?.access_token ||
        e.data?.token;
      if (token) {
        _token = token;
        window.removeEventListener('message', handler);
        clearTimeout(timer);
        if (_pendingTokenResolve) { _pendingTokenResolve(token); _pendingTokenResolve = null; }
      }
    };
    window.addEventListener('message', handler);

    try {
      window.parent.postMessage({ type: 'get_external_auth', callback: 'externalAuthCallback' }, '*');
    } catch(e) {}

    const timer = setTimeout(() => {
      window.removeEventListener('message', handler);
      _pendingTokenResolve = null;
      const urlToken = new URLSearchParams(window.location.search).get('token');
      _token = urlToken || '';
      resolve(_token);
    }, 3000);
  });
}

async function api(method, path, body) {
  const token = await getToken();
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch('/api/mad_planner' + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) {
    // Token udløbet — nulstil og prøv igen med nyt token
    _token = null;
    const newToken = await getToken();
    headers['Authorization'] = 'Bearer ' + newToken;
    const retry = await fetch('/api/mad_planner' + path, {
      method, headers,
      body: body ? JSON.stringify(body) : undefined
    });
    if (!retry.ok) throw new Error(await retry.text());
    return retry.json();
  }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Utilities ─────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, err=false) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function initials(navn) {
  return navn.trim().split(/\s+/).map(w => w[0] || '').join('').toUpperCase().slice(0, 2) || '?';
}

// ── Derived data ──────────────────────────────────────────────────────
function getAllKategorier() {
  const counts = {};
  retter.forEach(r => (r.kategorier||[]).forEach(k => { counts[k] = (counts[k]||0)+1; }));
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([v,c])=>({value:v,count:c}));
}
function getAllIngredienser() {
  const counts = {};
  retter.forEach(r => (r.ingredienser||[]).forEach(i => { counts[i] = (counts[i]||0)+1; }));
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([v,c])=>({value:v,count:c}));
}

// ── Smart Tag Input ───────────────────────────────────────────────────
function createTagInput(placeholder, isKat=false, getSuggestions=null) {
  let tags = [];
  let focusedIdx = -1;

  const outer = document.createElement('div');
  outer.className = 'tag-outer';

  const fieldWrap = document.createElement('div');
  fieldWrap.className = 'tag-field-wrap';

  const wrap = document.createElement('div');
  wrap.className = 'tag-input-wrap';

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = placeholder;
  inp.inputMode = 'text';
  inp.setAttribute('enterkeyhint', 'done');

  const suggBox = document.createElement('div');
  suggBox.className = 'tag-suggestions';
  suggBox.style.display = 'none';

  function getFiltered(q) {
    if (!getSuggestions) return [];
    return getSuggestions().filter(s => s.value.toLowerCase().includes(q.toLowerCase()) && !tags.includes(s.value)).slice(0, 8);
  }

  function showSuggestions(q) {
    const items = getFiltered(q);
    const hasNew = q.trim() && !tags.includes(q.trim()) && !items.find(i => i.value === q.trim());
    if (!items.length && !hasNew) { suggBox.style.display = 'none'; return; }
    focusedIdx = -1;
    suggBox.innerHTML = '';
    items.forEach(s => {
      const d = document.createElement('div');
      d.className = 'tag-sug-item';
      d.innerHTML = `<span>${esc(s.value)}</span><span class="sug-count">brugt ${s.count}×</span>`;
      d.onmousedown = e => { e.preventDefault(); addTag(s.value); };
      suggBox.appendChild(d);
    });
    if (hasNew) {
      const d = document.createElement('div');
      d.className = 'tag-sug-item tag-sug-new';
      d.innerHTML = `<span>+ Tilføj "<strong>${esc(q.trim())}</strong>"</span>`;
      d.onmousedown = e => { e.preventDefault(); addTag(q.trim()); };
      suggBox.appendChild(d);
    }
    suggBox.style.display = 'block';
  }

  function hideSuggestions() { suggBox.style.display = 'none'; focusedIdx = -1; }

  function addTag(val) {
    val = val.trim();
    if (val && !tags.includes(val)) { tags.push(val); renderTags(); }
    inp.value = '';
    hideSuggestions();
    inp.focus();
  }

  function renderTags() {
    wrap.querySelectorAll('.tag-pill').forEach(e => e.remove());
    tags.forEach((tag, i) => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill' + (isKat ? ' kat' : '');
      pill.innerHTML = `${esc(tag)} <button type="button">×</button>`;
      pill.querySelector('button').onclick = () => { tags.splice(i, 1); renderTags(); };
      wrap.insertBefore(pill, inp);
    });
  }

  inp.addEventListener('input', () => { if (getSuggestions) showSuggestions(inp.value); });
  inp.addEventListener('focus', () => { if (getSuggestions) showSuggestions(inp.value); });
  inp.addEventListener('blur', () => setTimeout(hideSuggestions, 150));
  inp.addEventListener('keydown', e => {
    const items = suggBox.querySelectorAll('.tag-sug-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      focusedIdx = Math.min(focusedIdx+1, items.length-1);
      items.forEach((el,i) => el.classList.toggle('focused', i===focusedIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      focusedIdx = Math.max(focusedIdx-1, 0);
      items.forEach((el,i) => el.classList.toggle('focused', i===focusedIdx));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (focusedIdx >= 0 && items[focusedIdx]) items[focusedIdx].onmousedown({ preventDefault: ()=>{} });
      else if (inp.value.trim()) addTag(inp.value);
    } else if (e.key === ',' && inp.value.trim()) {
      e.preventDefault();
      addTag(inp.value.replace(/,$/, ''));
    } else if (e.key === 'Backspace' && !inp.value && tags.length) {
      tags.pop(); renderTags();
    } else if (e.key === 'Escape') {
      hideSuggestions();
    }
  });

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'tag-add-btn';
  addBtn.textContent = '+';
  addBtn.title = 'Tilføj';
  addBtn.onclick = () => {
    if (inp.value.trim()) addTag(inp.value);
    else { inp.focus(); if (getSuggestions) showSuggestions(''); }
  };

  wrap.appendChild(inp);
  fieldWrap.appendChild(wrap);
  fieldWrap.appendChild(suggBox);
  outer.appendChild(fieldWrap);
  outer.appendChild(addBtn);

  outer._getTags = () => tags;
  outer._setTags = t => { tags = [...t]; renderTags(); };
  return outer;
}

// ── Person picker ─────────────────────────────────────────────────────
function createPersonPicker(selectedIds=[]) {
  let selected = [...selectedIds];
  const wrap = document.createElement('div');

  function render() {
    wrap.innerHTML = '';
    if (!personer.length) {
      wrap.innerHTML = '<div class="person-chip-empty">Ingen personer oprettet — gå til "Personer" i menuen</div>';
      return;
    }
    const chips = document.createElement('div');
    chips.className = 'person-chips';
    personer.forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'person-chip' + (selected.includes(p.id) ? ' selected' : '');
      chip.innerHTML = `<span>${esc(p.navn)}</span><span class="check">✓</span>`;
      chip.onclick = () => {
        selected = selected.includes(p.id) ? selected.filter(id => id !== p.id) : [...selected, p.id];
        render();
      };
      chips.appendChild(chip);
    });
    wrap.appendChild(chips);
  }

  render();
  wrap._getSelected = () => selected;
  wrap._setSelected = ids => { selected = [...ids]; render(); };
  return wrap;
}

// ── Data ──────────────────────────────────────────────────────────────
async function loadAll() {
  const [r, p] = await Promise.all([
    api('GET', '/retter').catch(() => []),
    api('GET', '/personer').catch(() => []),
  ]);
  retter = r;
  personer = p;
}

// ── Navigation ────────────────────────────────────────────────────────
function showPage(page) {
  currentPage = page;
  editingId = null;
  if (page === 'soeg') soegPersonIds = [];
  updateNav();
  render();
}

function editRet(id) {
  editingId = id;
  currentPage = 'rediger';
  updateNav();
  render();
}

function updateNav() {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const activeId = (currentPage === 'rediger') ? 'nav-ny' : 'nav-' + currentPage;
  const btn = document.getElementById(activeId);
  if (btn) btn.classList.add('active');
}

// ── Render ────────────────────────────────────────────────────────────
function render() {
  const el = document.getElementById('main-content');

  if (currentPage === 'soeg') {
    const personChipsHtml = personer.length
      ? personer.map(p => `<span class="person-search-chip${soegPersonIds.includes(p.id)?' selected':''}" onclick="togglePersonSearch('${p.id}',this)">👤 ${esc(p.navn)}</span>`).join('')
      : '<span style="color:var(--text-muted);font-size:13px;font-style:italic">Ingen personer oprettet</span>';

    el.innerHTML = `
      <div class="page-header">
        <div class="page-title">Find en ret</div>
        <div class="page-sub">Søg på ingredienser, kategorier og personer — flest matches vises øverst</div>
      </div>
      <div class="search-bar">
        <h3>🔍 Søgefiltre</h3>
        <div class="search-row">
          <div class="form-group" style="margin:0">
            <label>Ingredienser</label>
            <div id="soeg-ing-wrap"></div>
          </div>
          <div class="form-group" style="margin:0">
            <label>Kategorier</label>
            <div id="soeg-kat-wrap"></div>
          </div>
        </div>
        <div class="form-group" style="margin-top:14px;margin-bottom:0">
          <label>Person</label>
          <div class="person-search-chips">${personChipsHtml}</div>
        </div>
        <div class="search-action">
          <button class="btn" onclick="doSearch()">Søg</button>
          <button class="btn secondary" onclick="showPage('soeg')">Ryd</button>
        </div>
      </div>
      <div id="soeg-results">${renderCards(retter)}</div>
    `;
    const ingWrap = createTagInput('Tilsæt ingrediens…', false, getAllIngredienser);
    const katWrap = createTagInput('Tilsæt kategori…', true, getAllKategorier);
    document.getElementById('soeg-ing-wrap').replaceWith(ingWrap); ingWrap.id = 'soeg-ing-wrap';
    document.getElementById('soeg-kat-wrap').replaceWith(katWrap); katWrap.id = 'soeg-kat-wrap';

  } else if (currentPage === 'alle') {
    el.innerHTML = `
      <div class="page-header">
        <div class="page-title">Alle retter</div>
        <div class="page-sub">${retter.length} retter i din samling</div>
      </div>
      ${renderCards(retter)}
    `;

  } else if (currentPage === 'ny' || currentPage === 'rediger') {
    const ret = (currentPage === 'rediger') ? retter.find(r => r.id === editingId) : null;
    el.innerHTML = `
      <div class="page-header">
        <div class="page-title">${ret ? 'Rediger ret' : 'Ny ret'}</div>
        <div class="page-sub">${ret ? `Opdater oplysninger om ${esc(ret.navn)}` : 'Tilføj en ny ret til din samling'}</div>
      </div>
      <div class="panel">
        <div class="form-group">
          <label>Navn på retten *</label>
          <input type="text" id="f-navn" placeholder="f.eks. Spaghetti Bolognese" value="${esc(ret?.navn || '')}"/>
        </div>
        <div class="form-group">
          <label>Beskrivelse</label>
          <textarea id="f-desc" placeholder="Kort beskrivelse af retten…">${esc(ret?.beskrivelse || '')}</textarea>
        </div>
        <div class="form-group">
          <label>Ingredienser <span style="color:var(--text-muted);font-size:11px;text-transform:none">(vælg eksisterende eller tilsæt ny)</span></label>
          <div id="f-ing-wrap"></div>
        </div>
        <div class="form-group">
          <label>Kategorier <span style="color:var(--text-muted);font-size:11px;text-transform:none">(vælg eksisterende eller tilsæt ny)</span></label>
          <div id="f-kat-wrap"></div>
        </div>
        <div class="form-group">
          <label>Hvem kan lave retten?</label>
          <div id="f-person-wrap"></div>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="saveRet()">${ret ? 'Gem ændringer' : 'Opret ret'}</button>
          <button class="btn secondary" onclick="showPage('alle')">Annuller</button>
        </div>
      </div>
    `;
    const ingWrap = createTagInput('Tilsæt ingrediens…', false, getAllIngredienser);
    const katWrap = createTagInput('Tilsæt kategori…', true, getAllKategorier);
    const personWrap = createPersonPicker(ret?.personer || []);
    document.getElementById('f-ing-wrap').replaceWith(ingWrap); ingWrap.id = 'f-ing-wrap';
    document.getElementById('f-kat-wrap').replaceWith(katWrap); katWrap.id = 'f-kat-wrap';
    document.getElementById('f-person-wrap').replaceWith(personWrap); personWrap.id = 'f-person-wrap';
    if (ret) { ingWrap._setTags(ret.ingredienser || []); katWrap._setTags(ret.kategorier || []); }

  } else if (currentPage === 'personer') {
    el.innerHTML = `
      <div class="page-header">
        <div class="page-title">Personer</div>
        <div class="page-sub">Administrer hvem der kan lave retter</div>
      </div>
      <div class="panel" style="max-width:580px">
        <div class="form-group">
          <label>Tilføj ny person</label>
          <div class="inline-add">
            <input type="text" id="ny-person-navn" placeholder="Navn…" onkeydown="if(event.key==='Enter')addPerson()"/>
            <button class="btn" onclick="addPerson()">Tilføj</button>
          </div>
        </div>
        <div>
          <label style="margin-bottom:12px;display:block">Oprettede personer (${personer.length})</label>
          <div class="person-list">
            ${!personer.length
              ? '<div class="person-chip-empty" style="padding:8px 0">Ingen personer endnu</div>'
              : personer.map(p => {
                  const antal = retter.filter(r => (r.personer||[]).includes(p.id)).length;
                  return `<div class="person-row">
                    <div class="person-row-left">
                      <div class="person-avatar">${esc(initials(p.navn))}</div>
                      <div>
                        <div class="person-name">${esc(p.navn)}</div>
                        <div class="person-meta">${antal} ret${antal !== 1 ? 'ter' : ''}</div>
                      </div>
                    </div>
                    <button class="btn-sm danger" onclick="deletePerson('${p.id}')">Slet</button>
                  </div>`;
                }).join('')
            }
          </div>
        </div>
      </div>
    `;
  }
}

// ── Cards ─────────────────────────────────────────────────────────────
function renderCards(list, showMatch=false) {
  if (!list.length) return `<div class="empty"><div class="em-icon">🥄</div><p>Ingen retter fundet</p></div>`;
  return `<div class="cards-grid">${list.map(ret => {
    const retPersoner = (ret.personer||[]).map(pid => personer.find(p => p.id===pid)).filter(Boolean);
    return `<div class="card" onclick="openModal('${ret.id}')">
      ${showMatch && ret.matches > 0 ? `<div class="match-badge">${ret.matches} match</div>` : ''}
      <div class="card-name">${esc(ret.navn)}</div>
      <div class="card-desc">${esc(ret.beskrivelse||'')}</div>
      <div class="tags">
        ${retPersoner.map(p => `<span class="tag person">👤 ${esc(p.navn)}</span>`).join('')}
        ${(ret.kategorier||[]).map(k => `<span class="tag kat">${esc(k)}</span>`).join('')}
        ${(ret.ingredienser||[]).slice(0,4).map(i => `<span class="tag">${esc(i)}</span>`).join('')}
        ${(ret.ingredienser||[]).length > 4 ? `<span class="tag">+${ret.ingredienser.length-4} mere</span>` : ''}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="btn-sm" onclick="editRet('${ret.id}')">✏️ Rediger</button>
        <button class="btn-sm danger" onclick="deleteRet('${ret.id}')">🗑 Slet</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function togglePersonSearch(pid, el) {
  if (soegPersonIds.includes(pid)) { soegPersonIds = soegPersonIds.filter(i => i !== pid); el.classList.remove('selected'); }
  else { soegPersonIds.push(pid); el.classList.add('selected'); }
}

async function doSearch() {
  const ing = document.getElementById('soeg-ing-wrap')?._getTags?.() || [];
  const kat = document.getElementById('soeg-kat-wrap')?._getTags?.() || [];
  try {
    const res = await api('POST', '/soeg', { ingredienser: ing, kategorier: kat, personer: soegPersonIds });
    document.getElementById('soeg-results').innerHTML = renderCards(res, ing.length>0 || kat.length>0 || soegPersonIds.length>0);
  } catch(e) { toast('Søgning fejlede', true); }
}

async function saveRet() {
  const navn = document.getElementById('f-navn').value.trim();
  if (!navn) { toast('Navn er påkrævet', true); return; }
  const body = {
    navn,
    beskrivelse: document.getElementById('f-desc').value.trim(),
    ingredienser: document.getElementById('f-ing-wrap')?._getTags?.() || [],
    kategorier: document.getElementById('f-kat-wrap')?._getTags?.() || [],
    personer: document.getElementById('f-person-wrap')?._getSelected?.() || [],
  };
  try {
    if (currentPage === 'rediger' && editingId) {
      const updated = await api('PUT', '/retter/' + editingId, body);
      const idx = retter.findIndex(r => r.id === editingId);
      if (idx !== -1) retter[idx] = updated;
      toast('Ret opdateret ✓');
    } else {
      retter.push(await api('POST', '/retter', body));
      toast('Ret oprettet ✓');
    }
    showPage('alle');
  } catch(e) { toast('Kunne ikke gemme', true); }
}

async function deleteRet(id) {
  if (!confirm('Slet denne ret?')) return;
  try {
    await api('DELETE', '/retter/' + id);
    retter = retter.filter(r => r.id !== id);
    toast('Ret slettet');
    closeModal();
    render();
  } catch(e) { toast('Kunne ikke slette', true); }
}

async function addPerson() {
  const inp = document.getElementById('ny-person-navn');
  const navn = inp.value.trim();
  if (!navn) { toast('Navn mangler', true); return; }
  try {
    const p = await api('POST', '/personer', { navn });
    personer.push(p);
    inp.value = '';
    toast(`${navn} tilføjet ✓`);
    render();
  } catch(e) { toast('Kunne ikke tilføje', true); }
}

async function deletePerson(id) {
  const p = personer.find(p => p.id === id);
  const antal = retter.filter(r => (r.personer||[]).includes(id)).length;
  const msg = antal > 0
    ? `Slet ${p?.navn}? Personen er tilknyttet ${antal} ret(ter) — tilknytningen fjernes automatisk.`
    : `Slet ${p?.navn}?`;
  if (!confirm(msg)) return;
  try {
    await api('DELETE', '/personer/' + id);
    personer = personer.filter(p => p.id !== id);
    retter = retter.map(r => ({ ...r, personer: (r.personer||[]).filter(pid => pid !== id) }));
    toast('Person slettet');
    render();
  } catch(e) { toast('Kunne ikke slette', true); }
}

function openModal(id) {
  const ret = retter.find(r => r.id === id);
  if (!ret) return;
  const retPersoner = (ret.personer||[]).map(pid => personer.find(p => p.id===pid)).filter(Boolean);
  document.getElementById('modal-name').textContent = ret.navn;
  document.getElementById('modal-body').innerHTML = `
    ${ret.beskrivelse ? `<div class="detail-section"><h4>Beskrivelse</h4><p>${esc(ret.beskrivelse)}</p></div>` : ''}
    ${retPersoner.length ? `<div class="detail-section"><h4>Kan laves af</h4><div class="ing-list">${retPersoner.map(p=>`<span class="tag person">👤 ${esc(p.navn)}</span>`).join('')}</div></div>` : ''}
    ${ret.kategorier?.length ? `<div class="detail-section"><h4>Kategorier</h4><div class="ing-list">${ret.kategorier.map(k=>`<span class="tag kat">${esc(k)}</span>`).join('')}</div></div>` : ''}
    ${ret.ingredienser?.length
      ? `<div class="detail-section"><h4>Ingredienser (${ret.ingredienser.length})</h4><div class="ing-list">${ret.ingredienser.map(i=>`<span class="tag">${esc(i)}</span>`).join('')}</div></div>`
      : '<div class="detail-section"><p style="color:var(--text-muted)">Ingen ingredienser tilføjet</p></div>'}
  `;
  document.getElementById('modal-edit-btn').onclick = () => { closeModal(); editRet(id); };
  document.getElementById('modal-del-btn').onclick = () => deleteRet(id);
  document.getElementById('modal').style.display = 'flex';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').style.display = 'none';
}

// ── Init ──────────────────────────────────────────────────────────────
(async () => {
  // Hent token først — vis loading overlay imens
  await getToken();
  // Indlæs data
  await loadAll();
  // Skjul loading, vis app
  document.getElementById('loading-overlay').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  render();
})();
</script>
</body>
</html>
